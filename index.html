<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stok Gudang</title>
<style>
*{box-sizing:border-box}
:root{--g:#215a46;--cream:#f4f1e8;--bar:#dcdcdc;--ink:#14213d;--line:#6b7280;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);font-family:system-ui,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
label,.lb{display:block;font-size:18px;margin-bottom:6px;font-weight:600}
.mut{color:#6b7280;font-weight:400}
.i{min-height:56px;width:100%;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:18px}
textarea.i{padding:12px 14px;min-height:96px;resize:none}
.tb{min-height:48px;padding:0 18px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;border:1px solid var(--line);background:#fff}
.hdr{background:var(--bar);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.hdr b{font-size:22px}.hdr .who{margin-left:auto;margin-right:8px;font-size:17px}
.err{color:#b91c1c;font-weight:600;font-size:18px}
.pg{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px}
/* login */
.login{display:flex;justify-content:center;padding:90px 16px}
.card{width:360px;max-width:100%;background:#fff;border:1px solid #cfcfcf;border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:14px;height:fit-content}
.btn-g{min-height:60px;border:0;border-radius:6px;background:var(--g);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
/* menu */
.choices{flex:1;display:grid;grid-template-columns:repeat(2,280px);justify-content:center;align-content:center;gap:32px 40px}
.obx{position:fixed;left:12px;z-index:60;border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:600;background:#fef3c7;color:#92400e;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}.obx.bad{background:#fee2e2;color:#991b1b}.obx.fly{background:#e0f2fe;color:#075985}.obx[hidden]{display:none}
.big{width:280px;height:150px;border:0;border-radius:6px;background:#fff;color:var(--ink);box-shadow:0 8px 20px rgba(33,90,70,.55),0 2px 4px rgba(33,90,70,.40);font-size:28px;font-weight:600;cursor:pointer}
/* form */
.fh{margin:24px 24px 0;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.25);min-height:76px}
.fh b{font-size:30px;margin-left:24px;margin-right:auto}
.fh .clk{font-size:16px;text-align:right;line-height:1.35;margin-right:20px;color:#374151}
.fh .who{margin:0 8px 0 0;font-size:19px;font-weight:700}
.hb{min-height:52px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;border:2.5px solid #000;border-radius:6px;background:#fff;font-size:20px;font-weight:700;cursor:pointer}
.fb{flex:1;padding:36px 42px 24px;display:flex;flex-direction:column;gap:20px}
.cols{display:grid;grid-template-columns:minmax(280px,.9fr) 1.2fr minmax(260px,.85fr);gap:38px;align-items:start}
.cols h3,.cols label{margin:0 0 8px;font-size:21px;font-weight:700;display:block}
.lbox{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 8px rgba(0,0,0,.25);overflow:hidden}
.list{height:300px;overflow-y:auto;display:flex;flex-direction:column}
.list button{min-height:58px;text-align:left;padding:6px 12px;border:1px solid #444;border-radius:4px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:17px;font-weight:700}
.list button small,.sc small{display:block;font-size:11px;color:#555;font-weight:700}
.list button.on{background:#eef7f2}
.list p{margin:0;padding:14px;color:#4b5563;font-size:17px}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;flex-wrap:wrap}
.pager .nv{min-height:44px;min-width:64px;border:1px solid #444;border-radius:6px;background:#fff;font-weight:700;font-size:16px;cursor:pointer}
.pager .nv:disabled{opacity:.35}
.pager .pn{min-width:34px;min-height:40px;border:1px solid transparent;border-radius:8px;background:none;font-size:14px;font-weight:700;cursor:pointer}
.pager .pn.cur{border-color:var(--g);box-shadow:0 0 0 2px #cfe8dc}
.pager span{font-size:14px;font-weight:700}
.sh,.srow{display:grid;grid-template-columns:1fr 100px;gap:16px}
.srow{margin-bottom:10px;cursor:pointer}
.selw{min-height:230px}
.selw p{margin:0;padding:14px;color:#4b5563;font-size:17px}
.sc{border:1px solid #444;border-radius:6px;background:#fff;padding:6px 12px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:17px}
.sx{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:#fde2e2;box-shadow:0 0 8px rgba(239,68,68,.5);color:#dc2626;font-size:22px;cursor:pointer}
.sq{min-height:56px;border:1px solid #444;border-radius:6px;background:#fff;padding:0 12px;font-size:20px;font-weight:700;display:flex;align-items:center}
.sq.act{border:3px solid var(--g)}
.actb{background:#fff;border:1px solid #444;border-radius:6px;padding:8px 12px;min-height:58px;margin-bottom:8px;font-weight:700;font-size:17px}
.actb small{display:block;font-size:17px;color:#6b7280}
.pad{background:#000;border-radius:4px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:78px;border:0;border-radius:8px;background:#d9d9d9;font-size:42px;font-weight:700;cursor:pointer}
.pad button.del{font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px}
.foot .btn-g{width:320px;max-width:100%;min-height:58px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.searching .mid,.searching .padc{display:none}
.searching .cols{grid-template-columns:1fr}
.searching .list{height:220px}
@media(max-width:900px){.cols{grid-template-columns:1fr 1fr}.padc{grid-column:1/-1}.fb{padding:24px}}
/* tambahan: masuk dengan reparasi/reject, tambah barang, banner Minggu */
.sq{cursor:pointer}
.it{margin-bottom:10px}.it .srow{margin-bottom:6px}
.prob{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px;background:#f0f8f4;border:1px solid #b9d9c8;border-radius:6px}
.prob .t{width:100%;font-weight:700;font-size:15px;color:#374151}
.pf{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
.pf .sq{width:84px;min-height:46px}
.bk{font-weight:700;color:var(--g);font-size:17px}.bk.neg{color:#b91c1c}
.psum{font-size:15px;color:#374151;margin:0 0 4px 4px;font-weight:600}
.req{color:#b91c1c;font-weight:700}
.sun{margin:12px 24px 0;padding:12px 16px;border-radius:6px;background:#fee2e2;color:#991b1b;font-weight:700;font-size:17px}
.sun[hidden]{display:none}
.addbox{max-width:560px;width:100%;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:18px}
.hint{font-size:15px;color:#6b7280;margin-top:6px}
.big small{display:block;font-size:15px;font-weight:600;color:#b45309;margin-top:6px}
@media(max-width:700px){.choices{grid-template-columns:minmax(0,280px)}}
.notebox{margin-top:14px}.notebox[hidden]{display:none}
.notebox textarea{min-height:104px}
.searching .foot,.searching .notebox{display:none}
.dg.wide{width:680px;padding:32px}
.cl{border:1px solid #6b7280;border-radius:8px;text-align:left;max-height:48vh;overflow-y:auto;background:#fff}
.ci{padding:14px 18px;border-bottom:2px solid #9ca3af}.ci:last-child{border-bottom:0}
.ct{display:flex;justify-content:space-between;align-items:center;gap:16px}
.ct b{font-size:20px}.ct small{display:block;font-size:14px;color:#4b5563;font-weight:700}
.cq{font-size:30px;font-weight:700;min-width:72px;text-align:right}
.cd{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:17px}
.cn{margin-top:8px;padding:8px 12px;background:#f4f4f4;border-radius:6px;font-size:16px}
/* dialog */
.ov{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:center;justify-content:center;z-index:5}
.ov[hidden]{display:none}
.dg{background:#fff;border-radius:10px;padding:28px;width:440px;max-width:92%;text-align:center;display:flex;flex-direction:column;gap:16px;font-size:19px}
.dg ul{margin:0;padding:12px 16px;list-style:none;text-align:left;background:#f4f4f4;border-radius:8px;max-height:200px;overflow-y:auto;font-size:17px}
.dg .btns{display:flex;gap:12px;justify-content:center}
.dg .btns button{min-height:56px;min-width:130px}
.chk{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto}
/* role operator/QC, notifikasi reject, toast */
.hdr .pt{margin-left:auto;margin-right:8px;font-size:17px;font-weight:600;color:#374151}
.whp{display:block;font-size:13px;font-weight:600;color:#4b5563}
.fh .who{text-align:right;line-height:1.2}
.choices .big:last-child:nth-child(odd){grid-column:1/-1;justify-self:center}
.demo{border-top:1px solid #e5e7eb;padding-top:12px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chip.rst{width:100%;margin-top:8px;color:#b91c1c;background:#fff}
.chip{min-height:44px;border:1px solid var(--line);border-radius:6px;background:#f9fafb;font-size:14px;font-weight:600;cursor:pointer}
.rejp{margin:16px 24px 0;background:#fff7ed;border:2px solid #f59e0b;border-radius:8px;padding:12px 16px}
.rejt{display:flex;align-items:center;gap:10px;font-size:20px;flex-wrap:wrap}
.rejn{background:#f59e0b;color:#fff;border-radius:999px;min-width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.rejh{display:flex;align-items:stretch;gap:10px}
.rejtg{flex:1;display:flex;align-items:center;gap:12px;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-width:0}
.rejtg .tt{display:flex;flex-direction:column;min-width:0}.rejtg .tt b{font-size:19px}.rejtg .tt small{font-size:14px;color:#4b5563;font-weight:600}
.rejtg .chev{margin-left:auto;font-size:22px;transition:transform .2s;color:#92400e}
.rejp.open .chev{transform:rotate(180deg)}
.rejall{flex:none;width:auto;min-height:48px;padding:0 18px;font-size:17px}
.rejl{display:none;max-height:300px;overflow-y:auto;margin-top:10px;flex-direction:column;gap:8px}
.rejp.open .rejl{display:flex}
.rj{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #d6a45a;border-radius:6px;padding:8px 12px}
.rjm{flex:1}.rjm b{font-size:18px}.rjm small{display:block;font-size:13px;color:#4b5563;font-weight:700}
.rjb{width:130px;min-height:52px;font-size:18px;flex:none}
.searching #rej{display:none}
.toast{position:fixed;top:80px;right:16px;z-index:9;max-width:320px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;font-weight:700;font-size:17px;line-height:1.35;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
.toast[hidden]{display:none}
.list button small{line-height:1.35}
.rt{display:flex;align-items:center;gap:10px;flex:none}
.stk{font-size:15px;font-weight:700;color:var(--g);background:#eef7f2;border-radius:999px;padding:3px 10px}
.stk.zero{color:#b91c1c;background:#fee2e2}
/* ===== tata letak per perangkat: body[data-m] = desktop | tablet | hp (lihat MODE di script) ===== */
.padc{position:sticky;top:12px}
.padc .foot{margin-top:14px;align-items:stretch}
.padc .foot .btn-g{width:100%}
.padc .err{text-align:center;min-height:0}
.padc .notebox{margin:0}
.notebox textarea{min-height:56px;max-height:240px;overflow-y:auto;line-height:1.4;padding-top:14px}
.selw{max-height:calc(100dvh - 300px);overflow-y:auto;padding-right:4px}
.sqi{min-height:56px;width:100%;border:1px solid #444;border-radius:6px;background:#fff;padding:0 12px;font-size:20px;font-weight:700}
.sqi.act,.sqi:focus{border-color:var(--g);outline:3px solid var(--g);outline-offset:-3px}
.pf .sqi{width:84px;min-height:46px}
.warn{color:#b91c1c;font-weight:700}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center}
.bl span{display:block}
.lt{display:none}
.demo summary{cursor:pointer;font-size:14px;color:#6b7280}
/* numpad hanya untuk tablet */
.actb,.pad{display:none}
/* mode mengetik di kolom cari (keyboard bawaan menutup layar) tidak berlaku di desktop */
body[data-m=desktop] .searching .mid,body[data-m=desktop] .searching .padc{display:block}
body[data-m=desktop] .searching .cols{grid-template-columns:minmax(280px,.9fr) 1.2fr minmax(260px,.85fr)}
body[data-m=desktop] .searching .list{height:300px}
body[data-m=desktop] .searching .foot,body[data-m=desktop] .searching .notebox{display:flex}
body[data-m=desktop] .searching .notebox[hidden]{display:none}
body[data-m=desktop] .searching #rej{display:block}
@media(max-width:900px){
  .padc{position:static}
  .padc .foot{position:sticky;bottom:0;z-index:2;background:var(--cream);padding:10px 0 12px;margin-top:6px}
  .selw{max-height:none}
}
/* HP: ringkas. Tanpa numpad, Qty memakai keyboard angka bawaan, Simpan menempel di dasar layar */
body[data-m=hp]{font-size:15px}
body[data-m=hp] .hdr{padding:6px 12px;min-height:48px;gap:8px}
body[data-m=hp] .hdr b{font-size:16px;white-space:nowrap}
body[data-m=hp] .hdr .pt{font-size:12px;line-height:1.25;margin:0 4px 0 auto;text-align:right}
body[data-m=hp] .hdr .tb{min-height:36px;padding:0 12px;font-size:14px;border-radius:6px}
body[data-m=hp] .pg{padding:14px}
body[data-m=hp] .choices{grid-template-columns:1fr;gap:10px;align-content:start;justify-content:stretch;padding-top:6px}
body[data-m=hp] .big{width:100%;height:64px;font-size:18px;box-shadow:0 5px 12px rgba(33,90,70,.52),0 1px 3px rgba(33,90,70,.38)}
body[data-m=hp] .bl span{display:inline}
body[data-m=hp] .big small{font-size:12px;margin-top:2px}
/* login */
body[data-m=hp] .login{padding:44px 24px 24px;justify-content:stretch}
body[data-m=hp] .card{width:100%;border:0;background:transparent;padding:0;gap:12px}
body[data-m=hp] .lt{display:block;margin-bottom:10px}
body[data-m=hp] .lt b{display:block;font-size:24px}
body[data-m=hp] .lt span{font-size:14px;color:#6b7280}
body[data-m=hp] label{font-size:14px;margin-bottom:4px}
body[data-m=hp] .i{min-height:44px;font-size:16px;padding:0 12px;border-radius:8px}
body[data-m=hp] .btn-g{min-height:44px;font-size:16px;border-radius:8px}
body[data-m=hp] .chip{min-height:36px;font-size:12px}
body[data-m=hp] .err{font-size:14px}
/* form */
body[data-m=hp] .fh{margin:0;border-radius:0;box-shadow:none;min-height:52px;padding:6px 10px;gap:8px}
body[data-m=hp] .fh b{font-size:17px;margin:0 auto 0 4px}
body[data-m=hp] .fh .clk,body[data-m=hp] .whp,body[data-m=hp] .hbt{display:none}
body[data-m=hp] .fh .who{font-size:13px;margin:0}
body[data-m=hp] .hb{min-width:40px;min-height:40px;padding:0 8px;justify-content:center;border-width:2px}
body[data-m=hp] .fb{padding:12px}
body[data-m=hp] .cols{grid-template-columns:1fr;gap:14px}
body[data-m=hp] .cols h3,body[data-m=hp] .cols label{font-size:16px;margin-bottom:6px}
body[data-m=hp] .left .hint{display:none}
body[data-m=hp] .list{height:230px}
body[data-m=hp] .list button{min-height:46px;font-size:15px;padding:4px 10px}
body[data-m=hp] .list button small{font-size:10px}
body[data-m=hp] .pager{gap:2px;padding:6px 4px}
body[data-m=hp] .pager .nv{min-height:34px;min-width:48px;font-size:13px}
body[data-m=hp] .pager .pn{min-width:26px;min-height:34px;font-size:13px}
body[data-m=hp] .sh,body[data-m=hp] .srow{grid-template-columns:1fr 88px;gap:8px}
body[data-m=hp] .sh h3{margin:0}
body[data-m=hp] .selw{min-height:0;padding-right:0}
body[data-m=hp] .selw p{padding:8px 2px;font-size:14px}
body[data-m=hp] .sc{min-height:46px;font-size:15px;padding:4px 10px}
body[data-m=hp] .sx{width:30px;height:30px;font-size:18px}
body[data-m=hp] .sq,body[data-m=hp] .sqi{min-height:46px;font-size:18px}
body[data-m=hp] .pf .sqi{min-height:40px;width:76px}
body[data-m=hp] .prob{padding:6px 8px;gap:8px}
body[data-m=hp] .it{margin-bottom:8px}
body[data-m=hp] .notebox textarea{font-size:16px}
body[data-m=hp] .padc .foot{position:sticky;bottom:0;z-index:3;background:var(--cream);padding:8px 0 10px;margin-top:8px}
body[data-m=hp] .padc .foot .btn-g{min-height:44px;font-size:16px}
body[data-m=hp] .rejp,body[data-m=hp] .sun{margin:8px 12px 0;padding:10px 12px}
body[data-m=hp] .rejt{font-size:16px}
body[data-m=hp] .rejh{flex-direction:column;gap:8px}
body[data-m=hp] .rejall{width:100%;min-height:44px;font-size:15px}
body[data-m=hp] .rejtg .tt b{font-size:16px}body[data-m=hp] .rejtg .tt small{font-size:12px}
body[data-m=hp] .rj{flex-wrap:wrap;gap:8px}
body[data-m=hp] .rjb{width:100%;min-height:44px;font-size:16px}
body[data-m=hp] .cq{font-size:24px;min-width:48px}
body[data-m=hp] .addbox{border:0;background:none;padding:0;gap:14px}
body[data-m=hp] .dg{padding:20px;font-size:16px;gap:12px}
body[data-m=hp] .dg.wide{width:94%;padding:18px}
body[data-m=hp] .ct b{font-size:16px}
body[data-m=hp] .ci{padding:10px 12px}
body[data-m=hp] .dg .btns button{min-height:46px;min-width:110px;font-size:16px!important}
body[data-m=hp] .toast{left:8px;right:8px;max-width:none;font-size:15px}
/* ===== HP: ukuran ala Gojek + daftar scroll ===== */
body[data-m=hp]{font-size:14px}
body[data-m=hp] .padc{position:static}
body[data-m=hp] .hdr{min-height:44px;padding:4px 12px}
body[data-m=hp] .hdr b{font-size:15px}
body[data-m=hp] .hdr .pt{font-size:11px}
body[data-m=hp] .hdr .tb{min-height:32px;font-size:13px}
body[data-m=hp] .fh{min-height:48px}
body[data-m=hp] .fh b{font-size:16px}
body[data-m=hp] .fh .who{font-size:12px}
body[data-m=hp] .hb{min-width:36px;min-height:36px;border-width:1.5px;border-radius:8px}
body[data-m=hp] .hb svg{width:20px;height:20px}
body[data-m=hp] .fb{padding:12px;gap:14px}
body[data-m=hp] .cols{gap:12px}
body[data-m=hp] .cols h3,body[data-m=hp] .cols label,body[data-m=hp] label{font-size:14px;font-weight:600;margin-bottom:6px}
body[data-m=hp] .mut{font-size:12px!important}
body[data-m=hp] .i{min-height:40px;font-size:14px;border-radius:8px}
body[data-m=hp] textarea.i,body[data-m=hp] .notebox textarea{min-height:48px;font-size:14px;padding:10px 12px}
body[data-m=hp] .btn-g,body[data-m=hp] .padc .foot .btn-g{min-height:44px;font-size:15px;border-radius:8px}
body[data-m=hp] .err{font-size:13px}
body[data-m=hp] .big{height:56px;font-size:15px;border-radius:8px}
body[data-m=hp] .big small{font-size:11px}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const PER_PAGE = 10; // hasil pencarian per halaman
const MAX_PILIHAN = 50; // maksimal barang dalam satu transaksi
const app = document.getElementById('app'), ov = document.getElementById('ov');
const S = { u:null, mode:'Masuk', sel:[], active:null, page:1, sync:null };
const TITLE = { Masuk:'Barang Masuk', Keluar:'Barang Keluar' };
const $ = (id)=>document.getElementById(id);
const esc = (t)=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = (t)=>t.toLowerCase().replace(/[^a-z0-9]/g,'');
// Hari kerja Senin sampai Sabtu. Tambahkan ?uji=minggu di alamat file untuk mencoba tampilan hari Minggu.
const isSunday = ()=> new Date().getDay()===0 || new URLSearchParams(location.search).get('uji')==='minggu';
const stamp = ()=>({ createdAt:new Date().toISOString(), date:new Date().toLocaleDateString('sv-SE'), time:new Date().toLocaleTimeString('sv-SE') });

/* ===== TITIK SAMBUNG BACKEND (Laravel) =====
   Setiap transaksi membawa "pt" (indosteger | klopmart | narusafe). Pemetaan ke sheet (USULAN, perlu dikonfirmasi):
   IN          (operator) : QC in += qty                       -> barang masuk menunggu dicek QC (pending = in - out)
   QC          (QC)       : QC out += layak + reject         -> Masuk = QC out; reject juga ke Keluar (lewat notifikasi). Boleh dicicil: pending = in - out terbawa ke hari berikutnya
   OUT         (operator) : Keluar += qty                      -> reason "REJECT" (dari notifikasi QC, bawa noticeId) atau "LAINNYA" (sewa/jual)
   Sheet = minggu, blok = hari (Senin = 1 ... Sabtu = 6), diambil dari tanggal.
   Catatan disimpan per barang (items[].notes); wajib untuk barang yang ada reject. */
/* ===== Sambungan ke Google Sheets lewat Apps Script (Web App). URL kosong = transaksi tidak dikirim. =====
   Klopmart belum disambung: tata letak sheet-nya beda (per tanggal, tanpa kolom QC).
   Alur: simpan di aplikasi dulu (agar kerja tidak terhenti), lalu kirim ke sheet. Kalau gagal karena jaringan,
   transaksi masuk antrean (outbox) dan dikirim ulang otomatis. Aman diulang: script mengabaikan transaksi kembar. */
const GAS = { narusafe: 'https://script.google.com/macros/s/AKfycbzK-TIE_YAB9dNqa61rDJxDkomXBjtQeDyMFsQLV36Ec6mxqiDx9QiBMujETzRKFObL/exec', indosteger: 'https://script.google.com/macros/s/AKfycby1sX6WgCLKZEmAw9pJcTTDhKS18xmM5vKU6g29J-Uf1LDsRP_bZxckJuCz0HjOGlzycw/exec', klopmart: '' };
const GAS_KODE = 'stok-fb689fb1945d';
const OBX_KEY = 'stok_outbox_v1';
const obxLoad = ()=>{ try{ return JSON.parse(localStorage.getItem(OBX_KEY)||'[]'); }catch(e){ return []; } };
const obxSave = (a)=>{ try{ localStorage.setItem(OBX_KEY, JSON.stringify(a)); }catch(e){} };
const gasUrl = (pt)=>{ const u = GAS[pt]; return u ? (/\/exec$/.test(u) ? u : u.replace(/\/+$/,'')+'/exec') : ''; };
async function gasKirim(tx){ // {ok:true} | {ok:false,error,tetap:true} = ditolak sheet, diulang tidak menolong | {ok:false,error} = jaringan, boleh diulang
  const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 30000);
  try{
    const r = await fetch(gasUrl(tx.pt), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ kode:GAS_KODE, tx }), signal:ctl.signal });
    const j = await r.json();
    if(j.ok) return { ok:true };
    const msg = String(j.error||'Ditolak sheet');
    return { ok:false, error:msg, tetap: !/lock|timeout|timed out|server/i.test(msg) };
  }catch(e){ return { ok:false, error: e.name==='AbortError' ? 'Waktu habis' : 'Tidak tersambung ke sheet' }; }
  finally{ clearTimeout(tm); }
}
const obxFly = new Set();   // entri yang sedang dikirim (di halaman ini)
async function obxKirim1(e){ // kirim satu entri antrean di latar belakang
  if(obxFly.has(e.id)) return; obxFly.add(e.id); obxDraw();
  try{
    const r = await gasKirim(e.tx), a = obxLoad();
    if(r.ok){ obxSave(a.filter(x=>x.id!==e.id)); muatBarang(); }   // sheet berubah: ambil daftar dan stok terbaru
    else{
      obxSave(a.map(x=>x.id===e.id ? { ...x, error:r.error, tetap:!!r.tetap } : x));
      toast(r.tetap ? 'Ditolak sheet: '+r.error : 'Belum terkirim ke sheet, dicoba lagi otomatis');
    }
  } finally { obxFly.delete(e.id); obxDraw(); }
}
/* Tidak menunggu sheet: transaksi dicatat ke antrean (tahan tutup tab) lalu dikirim di latar belakang, layar langsung lanjut. */
async function saveTransaction(tx){
  if(!gasUrl(tx.pt)) return true;
  const tgl = new URLSearchParams(location.search).get('tgl');   // uji: ?tgl=2026-09-09
  const e = { id:Date.now()+'-'+Math.random().toString(36).slice(2,7), tx:{ ...tx, date: tgl || tx.date }, error:'', tetap:false };
  obxSave(obxLoad().concat(e));
  obxKirim1(e);
  return true;
}
async function obxKirimUlang(semua){
  const a = obxLoad().filter(e=>!obxFly.has(e.id) && (semua || !e.tetap));
  if(semua) obxSave(obxLoad().map(x=>a.some(y=>y.id===x.id) ? { ...x, tetap:false } : x));
  for(const e of a) await obxKirim1(e);
}
function obxDraw(){
  let b = document.getElementById('obx'); const a = obxLoad();
  if(!a.length){ if(b) b.hidden = true; return; }
  if(!b){ b = document.createElement('button'); b.id = 'obx'; b.type = 'button'; b.onclick = obxDialog; document.body.appendChild(b); }
  const tolak = a.filter(x=>x.tetap).length, kirim = a.filter(x=>!x.tetap && obxFly.has(x.id)).length, tunggu = a.length - tolak - kirim;
  const t = []; if(tolak) t.push('⚠ '+tolak+' ditolak sheet'); if(tunggu) t.push(tunggu+' menunggu terkirim'); if(kirim) t.push('Mengirim ke sheet…');
  b.className = 'obx' + (tolak ? ' bad' : (!tunggu ? ' fly' : '')); b.textContent = t.join(' · ');
  const hd = document.querySelector('.hdr'); b.style.top = (hd ? Math.round(hd.getBoundingClientRect().bottom)+8 : 16)+'px';
  b.hidden = false;
}
function obxDialog(){
  const a = obxLoad(), jn = { IN:'Barang masuk', OUT:'Barang keluar', QC:'Hasil QC', NEWITEM:'Barang baru' };
  dialog(`<b style="font-size:22px">Belum masuk ke sheet</b>
    <div class="cl">${a.map(e=>`<div class="ci"><div class="ct"><div><b>${jn[e.tx.type]||e.tx.type} · ${esc(e.tx.date||'')}</b><small>${(e.tx.items||[]).length} barang · ${esc(e.error||'')}${e.tetap?' (ditolak sheet)':''}</small></div></div></div>`).join('')}</div>
    <div class="btns"><button class="tb" id="obt">Tutup</button><button class="tb" id="obd">Buang yang ditolak</button><button class="tb btn-g" id="obk" style="min-height:56px;font-size:18px">Kirim ulang</button></div>`);
  $('obt').onclick = ()=>ov.hidden = true;
  $('obd').onclick = ()=>{ obxSave(obxLoad().filter(x=>!x.tetap)); obxDraw(); ov.hidden = true; };
  $('obk').onclick = async ()=>{ $('obk').disabled = true; await obxKirimUlang(true); ov.hidden = true; toast(obxLoad().length ? 'Masih ada yang belum terkirim' : 'Semua sudah terkirim ke sheet'); };
}
setInterval(()=>{ obxDraw(); if(navigator.onLine!==false && obxLoad().some(x=>!x.tetap && !obxFly.has(x.id))) obxKirimUlang(false); }, 15000);
addEventListener('online', ()=>obxKirimUlang(false));
setTimeout(obxDraw, 600);
/* DAFTAR BARANG DUA ARAH: sheet = sumber utama, aplikasi = jembatan.
   Barang yang ditambah di sheet muncul di aplikasi (dibaca lewat ?aksi=barang), barang yang ditambah di aplikasi dikirim ke sheet (type NEWITEM).
   Kalau sheet tidak terjangkau, dipakai daftar terakhir yang berhasil dibaca (atau daftar bawaan). */
const BS_KEY = 'stok_barang_sheet_v1';
let BSHEET = (()=>{ try{ return JSON.parse(localStorage.getItem(BS_KEY)||'{}'); }catch(e){ return {}; } })();
const hashNama = (t)=>{ let h = 5381; const x = norm(t); for(let i=0;i<x.length;i++) h = ((h<<5)+h+x.charCodeAt(i))>>>0; return h.toString(36).toUpperCase(); };
const kunciBarang = (sku,name)=> sku || 'BARU-'+hashNama(name);          // barang tanpa SKU: kunci sementara dari nama
const adaSku = (k)=>!/^BARU-/.test(k||'');
const skuTxt = (k)=> adaSku(k) ? esc(k) : 'SKU belum diisi';
/* Sinkron dengan sheet. Barang dikenali dari NOMOR barisnya (kolom No), bukan dari nama/SKU, jadi mengubah nama atau SKU di sheet
   tidak membuat barang ganda. Data yang tersimpan di aplikasi (antrean QC, stok, reject) ikut dipindah ke SKU/nama yang baru. */
function sinkronData(pt, lama, baru){
  const peta = {}, namaBaru = {}, kunciBaru = new Set(), namaSet = new Set();
  baru.forEach(i=>{ namaBaru[i.sku] = i.name; kunciBaru.add(i.sku); namaSet.add(norm(i.name)); });
  lama.forEach(i=>{
    let r = null;
    if(i.no!=null) r = baru.find(x=>x.no===i.no);
    else if(!adaSku(i.sku)) r = baru.find(x=>norm(x.name)===norm(i.name));   // barang baru dari aplikasi yang belum punya nomor
    if(r && r.sku!==i.sku) peta[i.sku] = r.sku;
  });
  const ks = Object.keys(peta);
  const hapus = ST.newItems.filter(i=>i.pt===pt && (kunciBaru.has(i.sku) || namaSet.has(norm(i.name)) || peta[i.sku]));   // sudah ada di sheet: sheet yang jadi acuan
  const namaBeda = (x)=>{ const k = peta[x.sku] || x.sku; return namaBaru[k]!==undefined && namaBaru[k]!==x.name; };
  const perluNama = ST.batches.some(b=>b.pt===pt && b.items.some(namaBeda)) || ST.notices.some(n=>n.pt===pt && namaBeda(n));
  if(!ks.length && !hapus.length && !perluNama) return;
  commit(st=>{
    const pindah = (x)=>{ if(peta[x.sku]) x.sku = peta[x.sku]; if(namaBaru[x.sku]!==undefined) x.name = namaBaru[x.sku]; };
    st.batches.forEach(b=>{ if(b.pt===pt) b.items.forEach(pindah); });
    st.notices.forEach(n=>{ if(n.pt===pt) pindah(n); });
    const q = st.qc[pt] || {}, o = st.outs[pt] || {};
    ks.forEach(k=>{ const t = peta[k];
      if(q[k]){ const c = q[t] || (q[t]={ layak:0, reject:0 }); c.layak += q[k].layak||0; c.reject += q[k].reject||0; delete q[k]; }
      if(o[k]!==undefined){ o[t] = (o[t]||0)+o[k]; delete o[k]; } });
    const gone = new Set(hapus.map(i=>i.sku+'|'+i.name));
    st.newItems = st.newItems.filter(i=>!(i.pt===pt && gone.has(i.sku+'|'+i.name)));
  });
}
const BIDX = {};   // indeks SKU -> barang dari sheet (termasuk stok tersedia)
const buatIdx = (pt)=>{ const m = {}; (BSHEET[pt]||[]).forEach(i=>{ m[i.sku] = i; }); BIDX[pt] = m; };
Object.keys(BSHEET).forEach(buatIdx);
let OBX_RAW = null, OBX_MAP = {};
const obxMap = ()=>{ let raw = null; try{ raw = localStorage.getItem(OBX_KEY); }catch(e){}   // perubahan stok dari kiriman yang belum sampai ke sheet
  if(raw!==OBX_RAW){ OBX_RAW = raw; OBX_MAP = {}; obxLoad().forEach(e=>{ const t = e.tx; if(!t || e.tetap) return;
    (t.items||[]).forEach(i=>{ const k = t.pt+'|'+i.sku; let d = 0;
      if(t.type==='OUT' && t.reason!=='REJECT') d = -(Number(i.qty)||0); else if(t.type==='QC') d = Number(i.layak)||0;
      if(d) OBX_MAP[k] = (OBX_MAP[k]||0)+d; }); }); }
  return OBX_MAP; };
async function muatBarang(ms){
  if(typeof S==='undefined' || !S.u) return false;

/* ===== DATA BERSAMA (REAL-TIME) =====
   Prototype ini memakai localStorage + pengecekan tiap 1 detik, jadi semua tab/tablet di browser yang sama saling melihat perubahan.
   Di Laravel: ganti commit()/load() dengan API + WebSocket (Laravel Reverb / Echo) atau polling. Bentuk datanya bisa dipakai apa adanya:
   batches[]  : barang masuk dari operator, status WAIT_QC -> QC_DONE
   notices[]  : info reject dari QC untuk operator, status WAIT -> DONE
   outs{}     : pt -> sku -> total keluar manual (sewa/jual), dipakai untuk menghitung stok
   qc{}       : pt -> sku -> {layak, reject} total hasil QC (dicicil). Item batch punya proc = jumlah yang sudah diproses QC
   Stok per PT per barang = total barang BAIK hasil QC - total keluar manual (sewa/jual). Reject tidak pernah masuk stok, jadi saat operator menyimpannya sebagai Keluar stok tidak dikurangi lagi. Stok awal belum ada di Excel, jadi mulai dari 0. */
const KEY = 'stok_state_v3';
const fresh = ()=>({ rev:0, seq:1, batches:[], notices:[], outs:{}, qc:{}, newItems:[] });
let MEM = null, RAW = null;
function load(){
  let raw = null; try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw===null) return MEM ? JSON.parse(MEM) : fresh();
  RAW = raw; try{ return Object.assign(fresh(), JSON.parse(raw)); }catch(e){ return fresh(); }
}
function save(st){ st.rev++; const raw = JSON.stringify(st); MEM = raw; try{ localStorage.setItem(KEY, raw); RAW = raw; }catch(e){} }
let ST = load();
/* Reset data demo: hapus semua barang masuk, antrean QC, notifikasi, stok, dan barang baru. Alur dan akun tidak berubah. */
function resetData(){ try{ localStorage.removeItem(KEY); }catch(e){} MEM = null; RAW = null; ST = fresh(); }
function commit(fn){ ST = load(); const r = fn(ST); save(ST); return r; }

const PT = ()=>D.pts[S.u.pt];
const ROLE = ()=>S.u.role==='qc' ? 'QC' : 'Operator';
const items = ()=>{ const pt = S.u.pt, sh = BSHEET[pt], base = (sh && sh.length) ? sh : (D.items[pt]||[]), have = new Set(base.map(i=>i.sku));
  const nama = new Set(base.map(i=>norm(i.name)));
  return base.concat(ST.newItems.filter(i=>i.pt===pt && !have.has(i.sku) && !nama.has(norm(i.name)))); }; // sheet sebagai acuan; barang baru yang belum sampai ke sheet tetap tampil
const qcOf = (st,pt,sku)=>((st.qc[pt]||{})[sku]) || { layak:0, reject:0 };
const stockLokal = (sku)=> (((D.opening||{})[S.u.pt]||{})[sku]||0) + qcOf(ST,S.u.pt,sku).layak - ((ST.outs[S.u.pt]||{})[sku]||0);
const stockOf = (sku)=>{ const pt = S.u.pt, it = (BIDX[pt]||{})[sku];   // sheet = acuan stok tersedia; kalau sheet belum terbaca, pakai hitungan lokal
  if(gasUrl(pt) && it && typeof it.stok==='number') return it.stok + (obxMap()[pt+'|'+sku]||0);
  return stockLokal(sku); };
const addOut = (st,pt,its)=>{ const o = st.outs[pt]||{}; its.forEach(s=>{ o[s.sku] = (o[s.sku]||0)+s.qty; }); st.outs[pt] = o; };
/* pending QC = barang masuk dikurangi yang sudah diproses QC (layak + reject), SKU sama digabung: [{sku,name,qty (sisa pending),n (jumlah pengiriman),notes}] */
const aggOf = (st,pt)=>{ const m = {};
  st.batches.filter(b=>b.pt===pt).forEach(b=>b.items.forEach(i=>{ const left = i.qty-(i.proc||0); if(left<=0) return; const a = m[i.sku] || (m[i.sku]={ sku:i.sku, name:i.name, qty:0, n:0, notes:[] }); a.qty += left; a.n++; if(i.notes) a.notes.push(i.notes); }));
  return Object.values(m); };
const waitAgg = ()=>aggOf(ST,S.u.pt);
const waitNotices = ()=>ST.notices.filter(n=>n.pt===S.u.pt && n.status==='WAIT').sort((a,b)=>a.createdAt<b.createdAt?-1:1);

/* SUARA NOTIFIKASI: nada singkat lewat WebAudio (tanpa file). Browser baru mengizinkan suara setelah layar disentuh sekali (login sudah termasuk). */
let AC = null;
const bukaSuara = ()=>{ try{ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} };
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, bukaSuara, { passive:true }));
function bunyi(jenis){ // 'masuk' = barang masuk untuk QC (3 nada naik) | 'reject' = reject dari QC untuk operator (2 nada rendah, diulang)
  try{
    bukaSuara(); if(AC && AC.state==='running'){
      const pola = jenis==='reject' ? [[587,0],[440,.2],[587,.55],[440,.75]] : [[784,0],[988,.16],[1319,.32]], t0 = AC.currentTime+.02;
      pola.forEach(([f,d])=>{ const o = AC.createOscillator(), g = AC.createGain(); o.type='sine'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
        g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(.35,t0+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+d+.18); o.start(t0+d); o.stop(t0+d+.2); });
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(jenis==='reject' ? [200,100,200] : [120,60,120]); }catch(e){}
}

function poll(){
  if(!S.u) return;
  let raw = null; try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw===RAW) return;
  if(raw===null){ MEM = null; RAW = null; } // data di-reset dari tab lain
  const qc = S.u.role==='qc', count = ()=>qc ? waitAgg().reduce((a,x)=>a+x.qty,0) : waitNotices().length;
  const before = count(); ST = load();
  if(count()>before){ bunyi(qc ? 'masuk' : 'reject'); toast(qc ? 'Ada barang masuk baru untuk dicek' : 'Ada barang reject baru dari QC. Cek di Barang Keluar'); }
  if(S.sync) S.sync();
}

  let drawing = false;
  const nChip = (s)=>Number(s.qty)>0 && !s.e_note, nOpen = (s)=>Number(s.qty)>0 && !!s.e_note;
  const ncpS = (s)=>`<button type="button" class="ncp${(s.note||'').trim()?'':' kosong'}" data-n="note" title="Catatan" ${nChip(s)?'':'hidden'}><span>${esc((s.note||'').trim()||'Catatan')}</span>${PEN}</button>`;
  const ntS = (s)=>`<input type="text" class="i nt" data-sku="${esc(s.sku)}" data-n="note" value="${esc(s.note||'')}" placeholder="Catatan..." autocomplete="off" ${nOpen(s)?'':'hidden'}>`;
  const syncNote = (row,s)=>{ const i = row.querySelector('.nt'), c = row.querySelector('.ncp'); if(!i||!c) return;
    i.hidden = !nOpen(s); c.hidden = !nChip(s); c.firstChild.textContent = (s.note||'').trim() || 'Catatan'; c.classList.toggle('kosong', !(s.note||'').trim()); };

  /* panel notifikasi reject dari QC (hanya di Barang Keluar) */
  let rl = $('rly'); if(!rl){ rl = document.createElement('div'); rl.id='rly'; rl.className='rly'; document.body.appendChild(rl); }
  rl.hidden = true; document.body.style.overflow = '';
  const RS = { open:false, sku:null };
  const closeRl = ()=>{ RS.open=false; rl.hidden=true; document.body.style.overflow=''; };
  const groupRej = ns=>{ const m=new Map(); ns.forEach(n=>{ if(!m.has(n.sku)) m.set(n.sku,{sku:n.sku,name:n.name,list:[],tot:0}); const g=m.get(n.sku); g.list.push(n); g.tot+=Number(n.qty); }); return [...m.values()]; };
  const drawLayer = ()=>{
    const ns = waitNotices();
    if(!ns.length){ closeRl(); return; }
    if(!RS.open){ rl.hidden=true; return; }
    const gs = groupRej(ns), tot = ns.reduce((a,n)=>a+Number(n.qty),0);
    if(RS.sku===null && gs.length===1) RS.sku = gs[0].sku;
    rl.hidden = false;
    rl.innerHTML = `<div class="pn" role="dialog" aria-modal="true" aria-label="Reject dari QC"><div class="hd"><div class="tt"><h2>Daftar Reject dari QC</h2><p>Barang berikut dinyatakan tidak layak oleh QC. Periksa jumlahnya, lalu simpan agar tercatat sebagai barang keluar.</p></div><button type="button" class="x" data-x aria-label="Tutup">✕</button></div>
      <div class="tb"><span>${gs.length} barang · ${tot} pcs menunggu dicatat</span><button type="button" class="btn-g rejall" data-all>Simpan semua (${ns.length})</button></div>
      <div class="bd">${gs.map(g=>`<div class="rg ${RS.sku===g.sku?'open':''}"><button type="button" class="rgh" data-g="${esc(g.sku)}" aria-expanded="${RS.sku===g.sku}"><span class="m"><b>${esc(g.name)}</b><small>${skuTxt(g.sku)} · Stok ${stockOf(g.sku)} · ${g.list.length} pengajuan</small></span><span class="q">${g.tot}</span><span class="ch">▾</span></button>
        <div class="rgb">${g.list.map(n=>`<div class="rj"><div class="rjm"><small>${esc(n.qcBy)} · ${esc(n.time)}</small>${n.note?`<div class="cn">Catatan: ${esc(n.note)}</div>`:''}</div><div class="cq">${n.qty}</div><button type="button" class="btn-g rjb" data-nid="${n.id}">Oke</button></div>`).join('')}</div></div>`).join('')}</div></div>`;
  };
  const drawRej = ()=>{
    const r = $('rej'); if(!r) return;
    const ns = keluar ? waitNotices() : [];
    const tot = ns.reduce((a,n)=>a+Number(n.qty),0);
    r.innerHTML = ns.length ? `<div style="margin:16px 24px 0"><button type="button" class="rbar" data-open><span class="rejn">${ns.length}</span><span class="tt"><b>Reject dari QC</b><small>${tot} pcs menunggu dicatat sebagai barang keluar</small></span><span class="go">Lihat daftar ›</span></button></div>` : '';
    drawLayer();
  };
  const busy = new Set();
  const saveRej = async (ids, btn)=>{
    if(isSunday()) return toast('Hari Minggu tidak ada pencatatan.');
    if(ids.some(i=>busy.has(i))) return;
    ids.forEach(i=>busy.add(i)); if(btn) btn.disabled = true;
    let done = 0;
    for(const id of ids){
      const n = commit(st=>{ const x=st.notices.find(y=>y.id===id); if(!x||x.status!=='WAIT') return null; x.status='DONE'; x.doneBy=S.u.name; x.doneAt=new Date().toISOString(); return x; }); // reject tidak mengurangi stok lagi: sudah tidak dihitung sebagai stok sejak QC
      if(n){ done++; await saveTransaction({ type:'OUT', reason:'REJECT', pt:S.u.pt, operator:S.u.name, noticeId:n.id, ...stamp(), items:[{ sku:n.sku, name:n.name, qty:n.qty, notes:n.note }] }); }
    }
    ids.forEach(i=>busy.delete(i)); drawRej(); drawList(); drawSel();
    //
  };
  $('rej').onclick = e=>{ if(e.target.closest('[data-open]')){ RS.open=true; RS.sku=null; document.body.style.overflow='hidden'; drawLayer(); } };
  rl.onclick = e=>{
    if(e.target===rl || e.target.closest('[data-x]')) return closeRl();
    const g = e.target.closest('[data-g]'); if(g){ RS.sku = RS.sku===g.dataset.g ? '' : g.dataset.g; return drawLayer(); }
    const all = e.target.closest('[data-all]'); if(all) return saveRej(waitNotices().map(n=>n.id), all);
    const b = e.target.closest('[data-nid]'); if(b) saveRej([b.dataset.nid], b);
  };
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && RS.open) closeRl(); });

  const drawList = ()=>{
    const q = norm($('q').value), pool = items();
    const all = pool.filter(i=>norm((adaSku(i.sku)?i.sku:'')+i.name).includes(q));
    const pages = Math.max(1, Math.ceil(all.length/PER_PAGE)); S.page = Math.min(S.page, pages);
    const rows = all.slice((S.page-1)*PER_PAGE, S.page*PER_PAGE);
    $('list').innerHTML = rows.length ? rows.map(i=>{ const on=S.sel.some(x=>x.sku===i.sku);
      return `<button data-sku="${esc(i.sku)}" class="${on?'on':''}"><span>${esc(i.name)}<small>${skuTxt(i.sku)}${i.unit?' · '+esc(i.unit):''}</small></span><span class="rt">${keluar?`<span class="stk ${stockOf(i.sku)<=0?'zero':''}">Stok ${stockOf(i.sku)}</span>`:''}${on?I.ck:''}</span></button>`; }).join('')
      : `<p>Barang tidak ditemukan.</p>`;
    $('pager').innerHTML = `<button class="nv" data-p="${S.page-1}" ${S.page<=1?'disabled':''}>Back</button>`
      + pgs(S.page,pages).map(p=>p==='…'?'<span>…</span>':`<button class="pn ${p===S.page?'cur':''}" data-p="${p}">${p}</button>`).join('')
      + `<button class="nv" data-p="${S.page+1}" ${S.page>=pages?'disabled':''}>Next</button>`;
  };
  const drawNote = ()=>{ $('nbox').hidden = true; }; // catatan inline di sebelah Qty tiap barang (opsional)
  const drawAct = ()=>{
    const a = S.active, s = a && S.sel.find(x=>x.sku===a.sku);
    $('actb').innerHTML = s ? `${esc(s.name)}<small>${masuk?'Qty diterima':'Qty'}: ${s.qty||'0'}${keluar?' · Stok '+stockOf(s.sku)+(over(s)?' <span class="req">Melebihi stok</span>':''):''}</small>` : '<span class="mut">Pilih barang, lalu isi Qty</span>';
    drawNote();
  };
  const drawSel = ()=>{
    drawing = true;
    $('sel').innerHTML = S.sel.length ? S.sel.map(s=>{
      const sub = keluar ? `${skuTxt(s.sku)} · Stok ${stockOf(s.sku)}` : skuTxt(s.sku);
      return `<div class="it" data-sku="${esc(s.sku)}"><div class="srow one"><div class="sc"><span>${esc(s.name)}<small>${sub} <span class="warn" ${over(s)?'':'hidden'}>· Melebihi stok</span></small></span><button class="sx" data-rm="${esc(s.sku)}" aria-label="Hapus ${esc(s.name)}">×</button></div></div>
        <div class="qblk ctl"><div class="qrow"><div class="pf">Qty ${qin(s)}</div>${ncpS(s)}</div>${ntS(s)}</div></div>`;
    }).join('') : '<p>Belum ada barang dipilih.</p>';
    drawing = false;
    $('cnt').innerHTML = 'Pilihan Barang <span class="mut" style="font-size:16px">('+S.sel.length+'/'+MAX_PILIHAN+')</span>';
    drawAct();
  };
  const setActive = (sku)=>{
    if(S.active && S.active.sku===sku) return;
    S.active = { sku, f:'qty' };
    document.querySelectorAll('#sel .sqi').forEach(i=>i.classList.toggle('act', i.dataset.sku===sku));
    drawAct();
  };
  $('list').onclick = (e)=>{
    const b = e.target.closest('button'); if(!b) return;
    const sku = b.dataset.sku, at = S.sel.findIndex(x=>x.sku===sku);
    if(at>=0){ S.sel.splice(at,1); if(S.active&&S.active.sku===sku) S.active=null; }
    else { if(S.sel.length>=MAX_PILIHAN) return $('err').textContent='Maksimal '+MAX_PILIHAN+' barang. Hapus salah satu dulu.';
      S.sel.push({...items().find(i=>i.sku===sku), qty:''}); S.active={ sku, f:'qty' }; }
    $('err').textContent=''; drawList(); drawSel();
    if(at<0){ const row = document.querySelector('#sel .it[data-sku="'+CSS.escape(sku)+'"]'); if(row) row.scrollIntoView({ block:'nearest' }); if(MODE()==='desktop') focusQty(sku); }
  };
  $('pager').onclick = (e)=>{ const b=e.target.closest('[data-p]'); if(b&&!b.disabled){ S.page=Number(b.dataset.p); drawList(); } };
  $('sel').onclick = (e)=>{
    const it = e.target.closest('.it'); if(!it) return;
    const sku = it.dataset.sku;
    if(e.target.closest('[data-rm]')){ S.sel = S.sel.filter(x=>x.sku!==sku); if(S.active&&S.active.sku===sku) S.active=null; drawList(); drawSel(); return; }
    const cp = e.target.closest('.ncp');
    if(cp){ const s = S.sel.find(x=>x.sku===sku); if(s){ s.e_note = true; syncNote(it,s); const i = it.querySelector('.nt'); setActive(sku); if(i){ i.focus(); const l = i.value.length; try{ i.setSelectionRange(l,l); }catch(x){} } } return; } // ketuk catatan di samping Qty: buka untuk diisi/diedit
    if(e.target.closest('.nt')){ setActive(sku); return; }
    if(!e.target.closest('.sqi')){ setActive(sku); focusQty(sku); }
  };
  $('sel').addEventListener('focusin', (e)=>{ const t = e.target.closest('.sqi'); if(t) setActive(t.dataset.sku); });
  $('sel').addEventListener('focusout', (e)=>{ // selesai mengetik catatan: ringkas ke samping Qty
    const nt = e.target.closest('.nt'); if(!nt || drawing) return;
    const s = S.sel.find(x=>x.sku===nt.dataset.sku); if(!s) return;
    s.e_note = false; syncNote(nt.closest('.it'), s);
  });
  $('sel').addEventListener('input', (e)=>{
    const nt = e.target.closest('.nt');
    if(nt){ const s0 = S.sel.find(x=>x.sku===nt.dataset.sku); if(s0) s0.note = nt.value; return; }
    const t = e.target.closest('.sqi'); if(!t) return;
    const s = S.sel.find(x=>x.sku===t.dataset.sku); if(!s) return;
    t.value = digits(t.value); s.qty = t.value; syncNote(t.closest('.it'), s);
    const w = t.closest('.it').querySelector('.warn'); if(w) w.hidden = !over(s);
    $('err').textContent = ''; drawAct();
  });
  $('sel').addEventListener('keydown', (e)=>{ if(e.key==='Enter' && e.target.closest('.sqi')){ e.preventDefault(); $('q').focus(); $('q').select(); } }); // Enter: lanjut cari barang berikutnya
  $('q').oninput = ()=>{ S.page=1; drawList(); };
  $('notes').oninput = ()=>{ const a=S.active, t=a&&S.sel.find(x=>x.sku===a.sku); if(t) t.note = $('notes').value; autosize($('notes')); };
  $('q').onclick = ()=>{ if(MODE()==='desktop') return; form.classList.add('searching'); $('fin').style.display='inline-flex'; };
  $('fin').onclick = ()=>{ form.classList.remove('searching'); $('fin').style.display='none'; };

  $('pad').innerHTML = padHtml(); // numpad hanya tampil di mode tablet
  $('pad').onclick = (e)=>{
    const kb = e.target.closest('[data-k]'), a = S.active, s = a && S.sel.find(x=>x.sku===a.sku); if(!kb||!s) return;
    s.qty = padKey(s.qty, kb.dataset.k); $('err').textContent=''; drawSel();
  };


  $('save').onclick = ()=>{
    const err = (t)=>{ $('err').textContent = t; };
    if(isSunday()) return err('Hari Minggu tidak ada pencatatan.');
    if(!S.sel.length) return err('Pilih barang dulu.');
    const bad = S.sel.find(s=>!(Number(s.qty)>0));
    if(bad){ S.active={ sku:bad.sku, f:'qty' }; drawSel(); focusQty(bad.sku); return err('Isi Qty untuk: '+bad.name); }
    err('');
    const line = (s)=>`<div class="ci"><div class="ct"><div><b>${esc(s.name)}</b><small>${skuTxt(s.sku)}</small></div><div class="cq">${s.qty}</div></div>`
      + (over(s) ? `<div class="cd"><span class="req">Melebihi stok (${stockOf(s.sku)})</span></div>` : '')
      + ((s.note||'').trim() ? `<div class="cn">Catatan: ${esc(s.note.trim())}</div>` : '') + '</div>';
    dialog(`<b style="font-size:22px">Konfirmasi</b><div>${masuk?'Apakah jumlah sudah sesuai dengan surat jalan?':'Apakah data sudah sesuai dengan jumlah barang?'}</div>
      <div class="cl">${S.sel.map(line).join('')}</div>
      <div class="btns"><button class="tb" id="no">Batal</button><button class="tb btn-g" id="yes" style="min-height:56px;font-size:18px">Ya, Simpan</button></div>`);
    $('no').onclick = ()=>ov.hidden = true;
    $('yes').onclick = async ()=>{
      $('yes').disabled = true;
      const its = S.sel.map(s=>({ sku:s.sku, name:s.name, qty:Number(s.qty), notes:(s.note||'').trim() }));
      const meta = { pt:S.u.pt, operator:S.u.name, ...stamp() };
      const direct = masuk && PT().qc===false; // PT tanpa QC internal (Klopmart): barang masuk langsung jadi stok
      if(direct) commit(st=>{ const q = st.qc[S.u.pt] || (st.qc[S.u.pt]={}); its.forEach(i=>{ const c = q[i.sku] || (q[i.sku]={ layak:0, reject:0 }); c.layak += i.qty; });
        st.batches.push({ id:'B'+(st.seq++), status:'DIRECT', ...meta, items:its.map(i=>({ ...i, proc:i.qty })) }); });
      else if(masuk) commit(st=>{ st.batches.push({ id:'B'+(st.seq++), status:'WAIT_QC', ...meta, items:its }); });
      if(keluar) commit(st=>addOut(st,S.u.pt,its));
      await saveTransaction({ type: masuk?'IN':'OUT', ...(keluar?{reason:'LAINNYA'}:{}), ...(direct?{qc:false}:{}), ...meta, items:its });
      dialog(`<div class="chk">✓</div><b style="font-size:22px">Data telah tersimpan</b>${masuk?`<div style="font-size:16px;color:#4b5563">${direct?'Stok sudah bertambah.':'Barang masuk menunggu pengecekan QC.'}</div>`:''}<div class="btns"><button class="tb btn-g" id="ok" style="min-height:56px;font-size:18px">Selesai</button></div>`);
      $('ok').onclick = ()=>showForm(mode);
    };
  };
  S.sync = ()=>{ drawRej(); drawList(); keepFocus(drawSel); };
  S.relayout = ()=>{ placeNote(); keepFocus(drawSel); };
  S.onItems = ()=>{ drawRej(); drawList(); keepFocus(drawSel); }; drawRej(); drawList(); drawSel(); startClock();
}

/* ===== QC: cek barang masuk dari operator PT yang sama. SKU sama digabung jadi satu baris pending.
   Boleh dicicil: tiap Simpan, Layak masuk stok (Masuk), Reject dikirim ke operator (Keluar), sisanya tetap pending sampai dicek lagi (hari berikutnya juga boleh) ===== */
function showQC(){
  clearInterval(S.clock); ov.hidden = true;
  const Q = { rows:[], active:'', f:'layak' };
  app.innerHTML = `<div id="form" style="display:flex;flex-direction:column;min-height:100vh;min-height:100dvh">
    ${header('QC')}
    <div class="sun" ${isSunday()?'':'hidden'}>Hari Minggu tidak ada pencatatan. Data tidak bisa disimpan.</div>
    <div class="hint qhint"><b>Langkah:</b> 1) sentuh barang di antrean, 2) isi <b>Layak</b> dan <b>Reject</b> (atau tekan <b>Semua layak</b>), 3) tekan <b>Simpan</b>.</div>
    <div class="fb"><div class="cols">
      <div class="left"><h3>Antrean Pengecekan <span class="mut" id="qn" style="font-size:16px"></span></h3>
        <div class="lbox"><div class="list" id="qlist"></div></div></div>
      <div class="mid"><h3>Hasil Pengecekan <span class="mut" id="qc" style="font-size:16px"></span></h3><div class="selw" id="sel"></div></div>
      <div class="padc"><div class="actb" id="actb"></div><div class="pad" id="pad"></div>
        <div class="foot"><div class="err" id="err"></div><button class="btn-g" id="save">Simpan</button></div></div>
    </div></div></div>`;
  $('lo').onclick = showLogin; $('back').onclick = showMenu;
  placeNote();

  const num = (v)=>Number(v||0);
  const done = (s)=>num(s.layak)+num(s.rej);
  const sisa = (s)=>Number(s.qty)-done(s);
  const bkTxt = (s)=>sisa(s)<0 ? 'Melebihi pending' : 'Sisa pending: '+sisa(s);
  const cur = ()=>Q.rows.find(x=>x.sku===Q.active);

  const drawQueue = ()=>{
    const ag = waitAgg(), bySku = Object.fromEntries(ag.map(a=>[a.sku,a]));
    const gone = Q.rows.filter(r=>!bySku[r.sku]);
    if(gone.length){ Q.rows = Q.rows.filter(r=>bySku[r.sku]); if(!cur()) Q.active = Q.rows.length ? Q.rows[0].sku : ''; toast('Ada barang yang sudah dicek QC lain'); }
    Q.rows.forEach(r=>{ r.opnote = bySku[r.sku].notes.join(' / '); if(r.qty!==bySku[r.sku].qty){ r.qty = bySku[r.sku].qty; if(done(r)>r.qty){ r.layak=''; r.rej=''; } } }); // pengiriman baru dengan SKU sama ikut digabung
    $('qn').textContent = ag.length ? '('+ag.length+')' : '';
    $('qlist').innerHTML = ag.length ? ag.map(a=>{ const on = Q.rows.some(r=>r.sku===a.sku);
      return `<button data-sku="${esc(a.sku)}" class="${on?'on':''}"><span>${esc(a.name)}<small>${skuTxt(a.sku)} · pending ${a.qty} unit${a.n>1?' · '+a.n+' pengiriman':''}</small></span>${on?I.ck:''}</button>`; }).join('')
      : '<p>Belum ada barang yang perlu dicek.</p>';
    keepFocus(drawRows);
  };
  const drawNote = ()=>{}; // catatan ada di dalam tiap blok Layak dan Reject
  const drawAct = ()=>{
    const s = cur();
    $('actb').innerHTML = s ? `${esc(s.name)}<small>Layak: ${s.layak||'0'} · Reject: ${s.rej||'0'} dari ${s.qty}</small>` : '<span class="mut">Pilih barang, lalu isi Layak dan Reject</span>';
    drawNote();
  };
  const qOf = (s,n)=>num(s[n==='nl'?'layak':'rej']);
  const noteChip = (s,n)=>qOf(s,n)>0 && !s['e_'+n];   // ada angka: catatan tampil ringkas di samping (isi catatan, atau tombol "Catatan" kalau masih kosong)
  const noteOpen = (s,n)=>qOf(s,n)>0 && !!s['e_'+n];  // kolom catatan di bawah hanya terbuka saat diketuk / diedit
  const ntInp = (s,n,ph)=>`<input type="text" class="i nt" data-sku="${esc(s.sku)}" data-n="${n}" value="${esc(s[n]||'')}" placeholder="${ph}" autocomplete="off" ${noteOpen(s,n)?'':'hidden'}>`;
  const ncp = (s,n)=>`<button type="button" class="ncp${(s[n]||'').trim()?'':' kosong'}" data-n="${n}" title="Catatan" ${noteChip(s,n)?'':'hidden'}><span>${esc((s[n]||'').trim()||'Catatan')}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>`;
  const syncNotes = (row,s)=>['nl','nr'].forEach(n=>{ const i = row.querySelector('.nt[data-n="'+n+'"]'), c = row.querySelector('.ncp[data-n="'+n+'"]'); if(!i||!c) return;
    i.hidden = !noteOpen(s,n); c.hidden = !noteChip(s,n); c.firstChild.textContent = (s[n]||'').trim() || 'Catatan'; c.classList.toggle('kosong', !(s[n]||'').trim()); });
  const inp = (s,f,lab)=>`<div class="pf">${lab} <input class="sqi ${Q.active===s.sku&&Q.f===f?'act':''}" data-sku="${esc(s.sku)}" data-f="${f}" value="${esc(s[f])}" placeholder="0" autocomplete="off" aria-label="${lab} ${esc(s.name)}" ${qtyAttrs()}></div>`;
  const drawRows = ()=>{
    $('qc').textContent = Q.rows.length ? '('+Q.rows.length+'/'+MAX_PILIHAN+')' : '';
    Q.drawing = true;
    $('sel').innerHTML = Q.rows.length ? Q.rows.map(s=>
      `<div class="it" data-sku="${esc(s.sku)}"><div class="srow"><div class="sc"><span>${esc(s.name)}<small>${skuTxt(s.sku)}</small></span><button class="sx" data-rm="${esc(s.sku)}" aria-label="Hapus ${esc(s.name)}">×</button></div><div class="sq" style="cursor:default" title="Pending"><b>${s.qty}</b><small>pending</small></div></div>
        <div class="qblk ok"><div class="qrow">${inp(s,'layak','Layak')}<button type="button" class="chip" data-all="1">Semua layak</button>${ncp(s,'nl')}</div>${ntInp(s,'nl','Catatan...')}</div>
        <div class="qblk bad"><div class="qrow">${inp(s,'rej','Reject')}${ncp(s,'nr')}</div>${ntInp(s,'nr','Catatan ...')}</div>
        <div class="bkrow"><span class="bk ${sisa(s)<0?'neg':''}">${bkTxt(s)}</span></div>${s.opnote?`<div class="cn">Catatan operator: ${esc(s.opnote)}</div>`:''}</div>`).join('')
      : '<p>Pilih barang di antrean untuk dicek.</p>';
    Q.drawing = false;
    drawAct();
  };
  const setActive = (sku)=>{
    Q.active = sku;
    document.querySelectorAll('#sel .sqi').forEach(i=>i.classList.toggle('act', i.dataset.sku===sku && i.dataset.f===Q.f));
    drawAct();
  };
  $('qlist').onclick = (e)=>{
    const b = e.target.closest('[data-sku]'); if(!b) return;
    const sku = b.dataset.sku, at = Q.rows.findIndex(x=>x.sku===sku);
    if(at>=0){ Q.rows.splice(at,1); if(Q.active===sku) Q.active = Q.rows.length ? Q.rows[0].sku : ''; }
    else { if(Q.rows.length>=MAX_PILIHAN) return $('err').textContent='Maksimal '+MAX_PILIHAN+' barang sekali cek. Simpan dulu, atau hapus salah satu.';
      const a = waitAgg().find(x=>x.sku===sku); if(!a) return;
      Q.rows.push({ sku:a.sku, name:a.name, qty:a.qty, layak:'', rej:'', nl:'', nr:'', opnote:a.notes.join(' / ') }); Q.active = sku; Q.f = 'layak'; }
    $('err').textContent=''; drawQueue();
    if(at<0 && MODE()==='desktop') focusQty(sku);
  };
  $('sel').onclick = (e)=>{
    const it = e.target.closest('.it'); if(!it) return;
    const sku = it.dataset.sku;
    if(e.target.closest('[data-rm]')){ Q.rows = Q.rows.filter(x=>x.sku!==sku); if(Q.active===sku) Q.active = Q.rows.length ? Q.rows[0].sku : ''; drawQueue(); return; }
    if(e.target.closest('[data-all]')){ const s = Q.rows.find(x=>x.sku===sku); if(s){ const v = Number(s.qty)-num(s.rej); s.layak = v>0 ? String(v) : ''; s.auto = true; Q.f = 'layak'; Q.active = sku; $('err').textContent=''; drawRows(); } return; } // Semua: sisa pending jadi layak
    const cp = e.target.closest('.ncp');
    if(cp){ const s = Q.rows.find(x=>x.sku===sku); if(s){ s['e_'+cp.dataset.n] = true; syncNotes(it,s); const i = it.querySelector('.nt[data-n="'+cp.dataset.n+'"]'); if(Q.active!==sku) setActive(sku); if(i){ i.focus(); const l = i.value.length; try{ i.setSelectionRange(l,l); }catch(x){} } } return; } // ketuk catatan di samping: buka lagi untuk diedit
    if(e.target.closest('.nt')){ if(Q.active!==sku) setActive(sku); return; } // ketuk kolom catatan: biarkan fokus di situ
    if(!e.target.closest('.sqi')){ setActive(sku); focusQty(sku); }
  };
  $('sel').addEventListener('focusin', (e)=>{ const t = e.target.closest('.sqi'); if(t){ Q.f = t.dataset.f; setActive(t.dataset.sku); } });
  $('sel').addEventListener('focusout', (e)=>{ // selesai mengetik catatan (pindah ke kolom/barang lain): ringkas ke samping
    const nt = e.target.closest('.nt'); if(!nt || Q.drawing) return;
    const s = Q.rows.find(x=>x.sku===nt.dataset.sku); if(!s) return;
    s['e_'+nt.dataset.n] = false; syncNotes(nt.closest('.it'), s);
  });
  $('sel').addEventListener('input', (e)=>{
    const nt = e.target.closest('.nt');
    if(nt){ const s0 = Q.rows.find(x=>x.sku===nt.dataset.sku); if(s0) s0[nt.dataset.n] = nt.value; return; }
    const t = e.target.closest('.sqi'); if(!t) return;
    const s = Q.rows.find(x=>x.sku===t.dataset.sku); if(!s) return;
    t.value = digits(t.value); s[t.dataset.f] = t.value;
    if(t.dataset.f==='layak') s.auto = false; // diubah manual: berhenti menyesuaikan otomatis
    if(t.dataset.f==='rej' && s.auto){ const v = Number(s.qty)-num(s.rej); s.layak = v>0 ? String(v) : ''; t.closest('.it').querySelector('.sqi[data-f="layak"]').value = s.layak; } // setelah "Semua layak", Layak = pending - Reject
    const row = t.closest('.it'), bk = row.querySelector('.bk'); bk.textContent = bkTxt(s); bk.classList.toggle('neg', sisa(s)<0);
    syncNotes(row,s);
    $('err').textContent = ''; drawAct();
  });
  $('pad').innerHTML = padHtml(); // numpad hanya tampil di mode tablet
  $('pad').onclick = (e)=>{
    const kb = e.target.closest('[data-k]'), s = cur(); if(!kb||!s) return;
    const f = Q.f==='rej' ? 'rej' : 'layak';
    s[f] = padKey(s[f], kb.dataset.k); if(f==='layak') s.auto = false; if(f==='rej' && s.auto){ const v = Number(s.qty)-num(s.rej); s.layak = v>0 ? String(v) : ''; } $('err').textContent=''; drawRows();
  };

  $('save').onclick = ()=>{
    const err = (t)=>{ $('err').textContent = t; };
    if(isSunday()) return err('Hari Minggu tidak ada pencatatan.');
    if(!Q.rows.length) return err('Pilih barang yang mau dicek dulu.');
    const over = Q.rows.find(s=>sisa(s)<0);
    if(over){ Q.active = over.sku; drawRows(); return err('Layak + Reject melebihi pending: '+over.name); }
    const emp = Q.rows.find(s=>done(s)<=0);
    if(emp){ Q.active = emp.sku; Q.f = 'layak'; drawRows(); focusQty(emp.sku); return err('Isi Layak atau Reject untuk: '+emp.name); }
    err('');
    const line = (s)=>`<div class="ci"><div class="ct"><div><b>${esc(s.name)}</b><small>${skuTxt(s.sku)} · pending ${s.qty}</small></div><div class="cq">${done(s)}</div></div>
      <div class="cd"><span>Layak <b>${num(s.layak)}</b></span><span>Reject <b>${num(s.rej)}</b></span><span>Sisa <b>${sisa(s)}</b></span></div>`
      + ((s.nl||'').trim() && num(s.layak)>0 ? `<div class="cn">Catatan layak: ${esc(s.nl.trim())}</div>` : '')
      + ((s.nr||'').trim() && num(s.rej)>0 ? `<div class="cn">Catatan reject: ${esc(s.nr.trim())}</div>` : '')
      + (num(s.rej)>0 && !(s.nr||'').trim() ? `<div class="cn" style="color:#b45309">Reject belum diberi catatan</div>` : '') + '</div>';
    dialog(`<b style="font-size:22px">Konfirmasi</b><div>Apakah hasil pengecekan sudah sesuai?</div>
      <div class="cl">${Q.rows.map(line).join('')}</div>
      <div class="btns"><button class="tb" id="no">Batal</button><button class="tb btn-g" id="yes" style="min-height:56px;font-size:18px">Ya, Simpan</button></div>`);
    $('no').onclick = ()=>ov.hidden = true;
    $('yes').onclick = async ()=>{
      $('yes').disabled = true;
      const its = Q.rows.map(s=>({ sku:s.sku, name:s.name, pending:Number(s.qty), layak:num(s.layak), reject:num(s.rej), out:done(s), sisa:sisa(s), noteLayak:(s.nl||'').trim(), notesLayak:(s.nl||'').trim(), noteReject:(s.nr||'').trim(), notes:(s.nr||'').trim() }));
      const meta = { pt:S.u.pt, qc:S.u.name, ...stamp() };
      const res = commit(st=>{
        // pending harus masih cukup (bisa berubah kalau QC lain sudah menyimpan)
        const ag = aggOf(st,S.u.pt);
        for(const r of its){ const a = ag.find(x=>x.sku===r.sku); if(!a) return 'gone'; if(a.qty<r.out) return 'changed'; }
        const ids = new Set();
        its.forEach(r=>{
          let t = r.out;
          st.batches.filter(b=>b.pt===S.u.pt).forEach(b=>b.items.forEach(i=>{ // diproses dari pengiriman paling lama dulu
            if(i.sku!==r.sku || t<=0) return; const free = i.qty-(i.proc||0); if(free<=0) return;
            const x = Math.min(t,free); t -= x; i.proc = (i.proc||0)+x; ids.add(b.id);
          }));
          const q = st.qc[S.u.pt] || (st.qc[S.u.pt]={}), c = q[r.sku] || (q[r.sku]={ layak:0, reject:0 });
          c.layak += r.layak; c.reject += r.reject;
          if(r.reject>0) st.notices.push({ id:'N'+(st.seq++), pt:S.u.pt, sku:r.sku, name:r.name, qty:r.reject, note:r.notes, qcBy:S.u.name, status:'WAIT', createdAt:meta.createdAt, time:meta.time });
        });
        st.batches.forEach(b=>{ if(ids.has(b.id) && b.items.every(i=>(i.proc||0)>=i.qty)){ b.status='QC_DONE'; b.qcBy=S.u.name; b.qcAt=meta.createdAt; } });
        meta.batchIds = [...ids]; return 'ok'; });
      if(res!=='ok'){ dialog(`<b style="font-size:22px">${res==='gone'?'Sudah dicek':'Pending berubah'}</b><div>${res==='gone'?'Barang ini sudah selesai dicek oleh QC lain.':'Sisa pending barang ini sudah berkurang. Cek ulang jumlahnya.'}</div><div class="btns"><button class="tb btn-g" id="ok" style="min-height:56px;font-size:18px">Kembali</button></div>`); $('ok').onclick = ()=>{ ov.hidden = true; drawQueue(); }; return; }
      await saveTransaction({ type:'QC', ...meta, items:its });
      const nrej = its.filter(s=>s.reject>0).length, nsisa = its.filter(s=>s.sisa>0).length;
      dialog(`<div class="chk">✓</div><b style="font-size:22px">Hasil QC tersimpan</b>${nrej?'<div style="font-size:16px;color:#4b5563">Info reject sudah dikirim ke operator.</div>':''}${nsisa?'<div style="font-size:16px;color:#4b5563">'+nsisa+' barang masih punya sisa pending.</div>':''}<div class="btns"><button class="tb btn-g" id="ok" style="min-height:56px;font-size:18px">Selesai</button></div>`);
      $('ok').onclick = showQC;
    };
  };
  S.sync = drawQueue;
  S.relayout = ()=>{ placeNote(); keepFocus(drawRows); };
  drawQueue(); startClock();
}

function showAdd(){
  clearInterval(S.clock); ov.hidden = true; S.sync = null; S.onItems = null; muatBarang();
  app.innerHTML = `<div id="form" style="display:flex;flex-direction:column;min-height:100vh;min-height:100dvh">
    ${header('Tambah Barang')}
    <div class="fb"><div class="addbox">
      <div><label for="nname">Nama Barang</label><input class="i" id="nname" placeholder="Contoh: Mainframe 170 cm" autocomplete="off"></div>
      <div><label for="nsku">SKU <span class="mut">(opsional)</span></label><input class="i" id="nsku" placeholder="Contoh: MFP1700" autocomplete="off" autocapitalize="characters"><div class="hint">Boleh dikosongkan. SKU bisa diisi nanti di sheet, barangnya tetap bisa langsung dipakai. Kalau diisi: huruf, angka, dan tanda strip, tidak boleh sama dengan SKU yang sudah ada.</div></div>
      <div class="err" id="err"></div>
      <button class="btn-g" id="save">Simpan</button>
    </div></div></div>`;
  $('lo').onclick = showLogin; $('back').onclick = showMenu;
  $('save').onclick = async ()=>{
    const err = (t)=>{ $('err').textContent = t; };
    const sku = $('nsku').value.trim().toUpperCase().replace(/\s+/g,''), name = $('nname').value.trim().replace(/\s+/g,' ');
    if(!name) return err('Isi nama barang.');
    if(sku && !/^[A-Z0-9][A-Z0-9-]*$/.test(sku)) return err('SKU hanya boleh huruf, angka, dan tanda strip (-).');
    await muatBarang(5000); // pastikan daftar dari sheet terbaru sebelum cek duplikat
    ST = load();
    const dupSku = sku && items().find(i=>norm(i.sku)===norm(sku));
    if(dupSku) return err('SKU sudah dipakai oleh: '+dupSku.name+' ('+dupSku.sku+')');
    const dupName = items().find(i=>norm(i.name)===norm(name));
    if(dupName) return err('Nama barang sudah ada'+(adaSku(dupName.sku)?' dengan SKU '+dupName.sku:'')+'.');
    err('');
    dialog(`<b style="font-size:22px">Konfirmasi</b><div>Tambahkan barang baru ini?</div>
      <div class="cl"><div class="ci"><div class="ct"><div><b>${esc(name)}</b><small>${sku?esc(sku):'SKU belum diisi'}</small></div></div></div></div>
      <div class="btns"><button class="tb" id="no">Batal</button><button class="tb btn-g" id="yes" style="min-height:56px;font-size:18px">Ya, Simpan</button></div>`);
    $('no').onclick = ()=>ov.hidden = true;
    $('yes').onclick = async ()=>{
      $('yes').disabled = true;
      commit(st=>{ st.newItems.push({ sku:kunciBarang(sku,name), name, pt:S.u.pt, unit:'pcs' }); });
      await saveNewItem({ sku, name, createdBy:S.u.name, pt:S.u.pt, ...stamp() });
      dialog(`<div class="chk">✓</div><b style="font-size:22px">Barang baru tersimpan</b><div class="btns"><button class="tb btn-g" id="ok" style="min-height:56px;font-size:18px">Selesai</button></div>`);
      $('ok').onclick = showAdd;
    };
  };
  startClock(); $('nname').focus();
}

function dialog(html){ ov.innerHTML = `<div class="dg${html.includes('class="cl"')?' wide':''}">${html}</div>`; ov.hidden = false; }
showLogin();
</script>
